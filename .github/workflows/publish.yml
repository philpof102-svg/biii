name: Publish npm + MCP registry

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # GitHub OIDC → MCP registry namespace auth (io.github.philpof102-svg/*)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install (links vendored trust-core)
        run: npm install --no-audit --no-fund

      - name: Test (gate — never publish a red build)
        run: npm test

      - name: Verify the stdio MCP starts (initialize + tools/list)
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node bin/biii-mcp.js | grep -q '"tools"' && echo "MCP ok"

      # ══════════════════════════════════════════════════════════════════════════════════════
      # npm ET LE REGISTRE MCP SONT DEUX CANAUX, PAS UNE CHAINE.
      #
      # Avant le 2026-07-27 ils etaient chaines sans garde, et ca expliquait arithmetiquement
      # notre absence du registre : biii-mcp@0.1.0 avait ete publie a la main sur npm, donc sur
      # un tag v0.1.0 `npm publish` echouait forcement (EPUBLISHCONFLICT — on ne republie pas
      # une version existante), le job s'arretait, et les trois etapes du registre ne tournaient
      # jamais. Le registre restait vide pour une raison qui n'avait rien a voir avec lui, et
      # rien dans les logs ne disait "le registre a ete saute".
      #
      # Corrige en rendant l'etape npm CONDITIONNELLE a l'etat reel du registre npm, au lieu de
      # la laisser echouer. Pas de continue-on-error : ca avalerait aussi les vraies pannes npm.
      # ══════════════════════════════════════════════════════════════════════════════════════
      # ══════════════════════════════════════════════════════════════════════════════════════
      # LE TAG DOIT DIRE LA MEME CHOSE QUE package.json — constate le 2026-07-27.
      #
      # `v0.2.0` existait deja sur origin, pose sur un commit dont package.json declarait 0.1.0.
      # Rien ne comparait les deux: l'etape ci-dessous lit la version dans package.json et ignore
      # le nom du tag. Le workflow a donc tourne sur un tag "v0.2.0" en publiant 0.1.0 — et npm
      # est reste a 0.1.0 pendant que le depot croyait avoir sorti une 0.2.0.
      #
      # Ce n'est pas rattrapable apres coup: un tag pousse ne se re-pointe pas sans reecrire de
      # l'histoire publique. La seule sortie propre est un nouveau numero. Cette garde empeche la
      # prochaine occurrence, au lieu de compter sur l'attention de celui qui tague.
      # ══════════════════════════════════════════════════════════════════════════════════════
      - name: le tag correspond-il a la version du paquet ?
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          echo "tag=$TAG  package.json=$PKG  server.json=$SRV"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG mais package.json dit $PKG — on publierait $PKG sous une etiquette qui annonce $TAG. Corriger la version AVANT de taguer."
            exit 1
          fi
          if [ "$SRV" != "$PKG" ]; then
            echo "::error::server.json dit $SRV et package.json dit $PKG — le registre MCP annoncerait une version que npm ne sert pas."
            exit 1
          fi

      - name: npm — cette version est-elle deja publiee ?
        id: npmstate
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if npm view "biii-mcp@$V" version >/dev/null 2>&1; then
            echo "deja publie sur npm: biii-mcp@$V — l'etape publish sera sautee"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "absent de npm: biii-mcp@$V — l'etape publish tournera"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # ══════════════════════════════════════════════════════════════════════════════════════
      # LE JETON npm, VERIFIE SEULEMENT SI ON VA S'EN SERVIR — constate le 2026-07-27, deux fois.
      #
      # (1) Sur le tag v0.2.1, `npm publish` a echoue en ENEEDAUTH: le secret NPM_TOKEN n'existe pas
      #     sur ce depot, donc NODE_AUTH_TOKEN arrivait VIDE. L'echec a tue le job et les quatre
      #     etapes suivantes ont ete « skipped » — dont la publication au registre MCP, qui
      #     s'authentifie en OIDC et n'a AUCUN besoin de npm. Dans le journal ca ressemble a un saut
      #     deliberé, pas a un blocage. Meme motif que celui decrit plus haut, autre cause: le
      #     correctif precedent rendait npm conditionnel a « deja publie », pas a « npm peut-il
      #     seulement s'authentifier ».
      #
      # (2) ⚠️ ET MA PREMIERE CORRECTION A CREE LE BLOCAGE INVERSE. Je l'avais placee TOUT EN HAUT,
      #     donc elle echouait meme quand npm n'allait pas tourner. Or 0.2.1 a ete publie a la main
      #     entre-temps: `already=true`, l'etape publish est sautee, le jeton n'est plus necessaire —
      #     et la garde bloquait quand meme le registre. Reparer un blocage en en creant un autre,
      #     dans le seul cas qui restait a debloquer.
      #
      # La garde vit donc DANS l'etape qui en a besoin, sous la meme condition qu'elle. Pas de
      # continue-on-error: quand npm doit tourner et ne le peut pas, la release ne doit pas aboutir,
      # sinon le registre annoncerait une version que npm ne sert pas.
      # ══════════════════════════════════════════════════════════════════════════════════════
      - name: npm publish (bundles trust-core)
        if: ${{ inputs.dry_run != 'true' && steps.npmstate.outputs.already != 'true' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::le secret NPM_TOKEN est absent du depot, et cette version n'est PAS encore sur npm — la release ne peut pas aboutir. Ajouter un token d'automatisation npm dans Settings → Secrets → Actions, ou publier a la main depuis une machine connectee (npm publish --access public) puis relancer ce workflow: l'etape npm sera alors sautee et le registre MCP se mettra a jour tout seul."
            exit 1
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GARDE FAIL-CLOSED, avant de lister quoi que ce soit.
      #
      # server.json annonce aux clients un package npm a installer. Lister une version qui
      # n'existe pas sur npm produit exactement le pire cas : une entree de registre qui a l'air
      # bonne, que des agents decouvrent, et dont l'installation echoue chez eux. Mieux vaut ne
      # pas etre liste que d'etre liste et casse — donc on VERIFIE au lieu de supposer.
      - name: Garde — le package annonce par server.json existe-t-il vraiment sur npm ?
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          node -e '
            const s = require("./server.json");
            const p = (s.packages || []).find((x) => x.registryType === "npm");
            if (!p) { console.log("server.json ne declare aucun package npm — rien a verifier"); process.exit(0); }
            console.log("server.json annonce : " + p.identifier + "@" + p.version);
            require("child_process").execFileSync("npm", ["view", p.identifier + "@" + p.version, "version"], { stdio: "inherit" });
          '

      - name: Install mcp-publisher
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: MCP login (GitHub OIDC)
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: MCP publish (server.json → registry.modelcontextprotocol.io)
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher publish
